<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra cứu Tồn kho</title>
    <link rel="stylesheet" href="/assets/css/stock.css">
    <link rel="stylesheet" href="/assets/vendor/dataTables-2.3.4.min.css">
    <link rel="icon" type="image/x-icon" href="/assets/img/logo.png">
    <link rel="stylesheet" href="/assets/css/topbar.css">
    <link rel="stylesheet" href="/assets/css/controls.css">
</head>
<body>

    <div class="topbar">
        <div class="logo"><a href="/orders-list">PO-ZAIKO</a></div>
        <div class="menu-btn buttons-group">

            <ul></ul>
        </div>
        <div class="user-dropdown">
            <button class="user-btn"><span id="user-fullname">...</span> ▼</button>
            <div class="user-dropdown-content">
                <a href="#" id="logout">Đăng xuất</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>Tra cứu Tồn kho</h1>

        <div class="search">
            <input type="text" placeholder="Nhập mã sản phẩm hoặc tên sản phẩm" id="search-input">
            <button id="btn-search">Tìm kiếm</button>

            <button id="btn-issue" style="display:none">Xuất kho</button>
            <button id="btn-adjust" style="display:none">Điều chỉnh tồn</button>
        </div>

        <p style="color:#5d6d7e;font-size:13px;margin:-8px 0 16px;line-height:1.6">
            Bấm vào một dòng để xem <strong>sổ cái</strong> của sản phẩm đó - toàn bộ lượt
            nhập, xuất, điều chỉnh kèm người thực hiện và chứng từ gốc.
        </p>

        <div class="stock-table-container">
            <table class="stock-table" id="stock-table">
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Mã sản phẩm</th>
                        <th>Tên sản phẩm</th>
                        <th>Đơn vị</th>
                        <th>Số lượng</th>
                        <th>Đơn giá</th>
                        <th>Giá trị tồn</th>
                    </tr>
                </thead>
                <tbody id="stock-tbody"></tbody>
            </table>
        </div>
    </div>

    <script src="/assets/vendor/jquery-3.7.1.min.js"></script>
    <script src="/assets/vendor/dataTables-2.3.4.min.js"></script>
    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/stock.js"></script>
</body>
</html>
