<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết Nhà cung cấp</title>
    <link rel="stylesheet" href="/assets/css/product-detail.css">
    <link rel="icon" type="image/x-icon" href="/assets/img/logo.png">
    <link rel="stylesheet" href="/assets/css/topbar.css">
    <link rel="stylesheet" href="/assets/css/controls.css">
</head>
<body>

    <div class="topbar">
        <div class="logo"><a href="/orders-list">PO-ZAIKO</a></div>
        <div class="menu-btn buttons-group">

            <ul></ul>
        </div>
        <div class="user-dropdown">
            <button class="user-btn"><span id="user-fullname">...</span> ▼</button>
            <div class="user-dropdown-content">
                <a href="#" id="logout">Đăng xuất</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>Chi tiết Nhà cung cấp</h1>

        <input type="hidden" id="vendor-id">
        <div class="form-group">
            <label for="vendor-code">Mã nhà cung cấp</label>
            <input type="text" id="vendor-code" placeholder="Bỏ trống để hệ thống tự sinh (NCC001, NCC002...)">
        </div>
        <div class="form-group">
            <label for="vendor-name">Tên nhà cung cấp <span style="color:red">*</span></label>
            <input type="text" id="vendor-name" placeholder="Nhập tên nhà cung cấp">
        </div>
        <div class="form-group">
            <label for="vendor-address">Địa chỉ</label>
            <input type="text" id="vendor-address" placeholder="Nhập địa chỉ">
        </div>
        <div class="form-group">
            <label for="vendor-phone">Điện thoại</label>
            <input type="text" id="vendor-phone" placeholder="Nhập số điện thoại">
        </div>
        <div class="form-group">
            <label for="vendor-email">Email</label>
            <input type="email" id="vendor-email" placeholder="Nhập email">
        </div>
        <div class="form-group">
            <label for="vendor-taxcode">Mã số thuế</label>
            <input type="text" id="vendor-taxcode" placeholder="Nhập mã số thuế">
        </div>
        <div class="form-group form-group-check">
            <label class="check-label">
                <input type="checkbox" id="is-active" checked>
                <span>Còn hợp tác</span>
            </label>
            <small class="hint">
                Bỏ tích = ngừng hợp tác. Các đơn hàng cũ của NCC này giữ nguyên,
                nhưng không chọn được khi lập đơn mới.
            </small>
        </div>

        <button id="saveBtn">Lưu</button>
        <button id="backBtn">Hủy</button>
    </div>

    <script src="/assets/vendor/jquery-3.7.1.min.js"></script>
    <script src="/assets/js/common.js"></script>
    <script src="/assets/js/form-errors.js"></script>
    <script src="/assets/js/vendor-detail.js"></script>
</body>
</html>
